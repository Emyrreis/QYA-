[pytest]
# Onde procurar testes
testpaths = tests

# Padrões de descoberta
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão sempre aplicadas ao rodar `pytest`:
#  -v                       saída verbosa
#  --cov=app                mede cobertura do pacote app
#  --cov-report=term-missing  mostra linhas não cobertas no terminal
#  --cov-report=xml         gera coverage.xml (consumido pelo CI)
#  --cov-fail-under=70      Quality Gate: falha se cobertura < 70%
addopts =
    -v
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70

markers =
    unit: testes unitários
    integration: testes de integração
